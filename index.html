<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="theme-color" content="#84B9C9" />
    <title>網站暫停公開｜社團法人台灣白露社會福利服務協會</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #355b63;
        --muted: #5d625f;
        --mint: #91bea9;
        --sky: #bad8e1;
        --paper: #fafaf7;
        --line: #dce8e3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        font-family: "Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 20% 20%, rgba(186, 216, 225, 0.45), transparent 32%),
          radial-gradient(circle at 82% 78%, rgba(145, 190, 169, 0.35), transparent 34%),
          var(--paper);
        color: var(--ink);
      }

      main {
        width: min(620px, 100%);
        padding: 40px 32px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 18px 48px rgba(53, 91, 99, 0.14);
        text-align: center;
      }

      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--mint), var(--sky));
        box-shadow: 0 12px 28px rgba(132, 185, 201, 0.24);
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 6vw, 42px);
        line-height: 1.25;
        letter-spacing: 0;
      }

      p {
        margin: 18px auto 0;
        max-width: 30em;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.85;
      }

      .org {
        margin-top: 26px;
        color: var(--ink);
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="closed-title">
      <div class="mark" aria-hidden="true"></div>
      <h1 id="closed-title">網站暫停公開</h1>
      <p>本網站目前已依管理需求暫停對外公開。後續若重新開放，將由協會另行公告。</p>
      <p class="org">社團法人台灣白露社會福利服務協會</p>
    </main>
  </body>
</html>
